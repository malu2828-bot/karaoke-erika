<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke YouTube Sincronizado</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        h1 { color: #1DB954; } /* Estilo verde musical */

        .search-box {
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        input[type="text"] {
            width: 65%;
            padding: 12px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 12px 25px;
            background-color: #1DB954;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Contenedor del reproductor de YouTube */
        .video-wrapper {
            width: 100%;
            max-width: 560px;
            margin: 0 auto 25px auto;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        /* Contenedor del Karaoke */
        .lyrics-box {
            background-color: #181818;
            padding: 30px;
            border-radius: 10px;
            height: 250px;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            scroll-behavior: smooth;
        }

        /* Líneas de la letra */
        .lyric-line {
            font-size: 20px;
            margin: 15px 0;
            color: #666;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        /* Línea activa (cuando se está cantando) */
        .lyric-line.active {
            color: #ffffff;
            font-size: 26px;
            text-shadow: 0 0 10px #1DB954;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>YouTube Karaoke Player</h1>
    
    <div class="search-box">
        <input type="text" id="youtubeUrl" placeholder="Pega el link de YouTube de Laura Pausini...">
        <button onclick="procesarVideo()">Cargar Canción</button>
    </div>

    <!-- El div donde la API de YouTube insertará el reproductor dinámicamente -->
    <div class="video-wrapper">
        <div id="player"></div>
    </div>

    <!-- Caja de letras del Karaoke -->
    <div class="lyrics-box" id="lyricsContainer">
        <div id="lyricsContent">Pega un enlace válido para sincronizar la letra...</div>
    </div>
</div>

<!-- Cargamos la API oficial de reproducción de YouTube -->
<script src="https://youtube.com"></script>

<script>
    let player;
    let intervaloTiempo;

    // Base de datos de letras con marcas de tiempo (en segundos)
    const bibliotecaKaraoke = {
        "w3JoAPJu7ho": [
            { time: 0, text: "🎵 (Introducción Musical) 🎵" },
            { time: 19, text: "Un canario que canta triste por su amor" },
            { time: 24, text: "Y una guitarra que llora en un rincón" },
            { time: 29, text: "No es la misma vida que yo planeé" },
            { time: 33, text: "para los dos..." },
            { time: 36, text: "🎵" },
            { time: 38, text: "Entre tú y mil mares por medio" },
            { time: 43, text: "Viajará mi pensamiento" },
            { time: 47, text: "Cruzaré los dedos si estás bien o mal" },
            { time: 52, text: "Te buscaré si te vas..." }
        ]
    };

    // Función requerida por la API de YouTube para inicializarse
    function onYouTubeIframeAPIReady() {
        // Se deja listo el espacio del reproductor
    }

    function extraerId(url) {
    var regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    var match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
    }

    function procesarVideo() {
        const url = document.getElementById('youtubeUrl').value;
        const id = extraerId(url);

        if (!id) {
            alert("Enlace no válido de YouTube");
            return;
        }

        // Si el reproductor ya existía, lo destruimos para cargar el nuevo
        if (player && typeof player.destroy === 'function') {
            player.destroy();
            clearInterval(intervaloTiempo);
        }

        // Crear el nuevo reproductor oficial de YouTube
        player = new YT.Player('player', {
            height: '100%',
            width: '100%',
            videoId: id,
            events: {
                'onStateChange': alCambiarEstado
            }
        });

        montarLetra(id);
    }

    function montarLetra(id) {
        const container = document.getElementById('lyricsContent');
        container.innerHTML = "";

        if (bibliotecaKaraoke[id]) {
            bibliotecaKaraoke[id].forEach((linea, index) => {
                const div = document.createElement('div');
                div.className = "lyric-line";
                div.id = `line-${index}`;
                div.textContent = linea.text;
                container.appendChild(div);
            });
        } else {
            container.innerHTML = "Video cargado.<br>Letra no registrada para este ID en el sistema de sincronización.";
        }
    }

    // Monitorea si el usuario le dio Play o Pausa al video
    function alCambiarEstado(event) {
        if (event.data === YT.PlayerState.PLAYING) {
            // Cada 200 milisegundos revisa el tiempo del video para actualizar la letra
            intervaloTiempo = setInterval(actualizarKaraoke, 200);
        } else {
            clearInterval(intervaloTiempo);
        }
    }

    function actualizarKaraoke() {
        const url = document.getElementById('youtubeUrl').value;
        const id = extraerId(url);
        
        if (!bibliotecaKaraoke[id]) return;

        const tiempoActual = player.getCurrentTime();
        const lineas = bibliotecaKaraoke[id];
        let lineaActivaIndex = -1;

        // Determinar qué línea corresponde al segundo actual
        for (let i = 0; i < lineas.length; i++) {
            if (tiempoActual >= lineas[i].time) {
                lineaActivaIndex = i;
            }
        }

        if (lineaActivaIndex !== -1) {
            // Quitar clase activa a todas las líneas
            document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
            
            // Añadir clase activa a la línea actual
            const lineaActivaElemento = document.getElementById(`line-${lineaActivaIndex}`);
            if (lineaActivaElemento) {
                lineaActivaElemento.classList.add('active');
                
                // Autoscroll para mantener la letra centrada en la pantalla
                lineaActivaElemento.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    }
</script>
</body>
</html>
