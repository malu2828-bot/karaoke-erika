<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Karaoke Player</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        h1 { color: #1DB954; font-size: 32px; margin-bottom: 25px; }

        .search-box {
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        input[type="text"] {
            width: 65%;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            color: #000;
        }

        button {
            padding: 12px 25px;
            background-color: #1DB954;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1ed760;
        }

        .video-wrapper {
            width: 100%;
            max-width: 560px;
            margin: 0 auto 25px auto;
            aspect-ratio: 16/9;
            background: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        /* Estilo para el reproductor clásico */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .lyrics-box {
            background-color: #181818;
            padding: 30px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
        }

        .lyrics-text {
            font-size: 20px;
            line-height: 1.8;
            color: #ffffff;
            white-space: pre-line; /* Esto respeta los saltos de línea automáticamente */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>YouTube Karaoke Player</h1>
    
    <div class="search-box">
        <input type="text" id="youtubeUrl" placeholder="Pega el enlace de YouTube aquí...">
        <button onclick="cargarVideoClasico()">Cargar Canción</button>
    </div>

    <!-- Contenedor del reproductor clásico -->
    <div class="video-wrapper">
        <iframe id="reproductorClasico" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <!-- Caja de letras estática (Muestra toda la letra de golpe, sin riesgo de trabarse) -->
    <div class="lyrics-box">
        <div class="lyrics-text" id="textoLetra">Pega el enlace de la canción para ver su letra aquí...</div>
    </div>
</div>

<script>
    // Base de datos simplificada con las letras completas
    const bibliotecaLetras = {
        "eZ1OAcrcPzM": `¡Feliz Cumpleaños Erika! 🎂
        
        Que pases un excelente día en compañía de tus seres queridos.
        Disfruta mucho tu día, ríe, baila y canta.
        
        ¡Muchas felicidades en tu cumpleaños! 🎉`,

        "QycWbDcTK9w": `¡Feliz Cumpleaños Erika! 🎂
        
        Que pases un excelente día en compañía de tus seres queridos.
        Disfruta mucho tu día, ríe, baila y canta.
        
        ¡Muchas felicidades en tu cumpleaños! 🎉`,
        
        "w3JoAPJu7ho": `Laura Pausini - Entre Tú y Mil Mares

        Un canario que canta triste por su amor
        Y una guitarra que llora en un rincón
        No es la misma vida que yo planeé para los dos
        
        Entre tú y mil mares por medio
        Viajará mi pensamiento
        Cruzaré los dedos si estás bien o mal
        Te buscaré si te vas...`
    };

    // Función directa para cortar el enlace sin importar el formato
    function obtenerIdLimpio(url) {
        if (url.includes("youtu.be/")) {
            return url.split("youtu.be/")[1].split("?")[0];
        }
        if (url.includes("v=")) {
            return url.split("v=")[1].split("&")[0];
        }
        return null;
    }

    function cargarVideoClasico() {
        const enlaceInput = document.getElementById('youtubeUrl').value;
        const idVideo = obtenerIdLimpio(enlaceInput);

        if (!idVideo) {
            alert("Por favor, ingresa un enlace válido de YouTube.");
            return;
        }

        // 1. Cargamos el video de forma clásica e instantánea usando la URL de incrustación
        const iframe = document.getElementById('reproductorClasico');
        iframe.src = "https://youtube.com" + idVideo;

        // 2. Cargamos la letra correspondiente
        const cajaTexto = document.getElementById('textoLetra');
        if (bibliotecaLetras[idVideo]) {
            cajaTexto.textContent = bibliotecaLetras[idVideo];
        } else {
            cajaTexto.innerHTML = "¡Video cargado con éxito!<br><br>(Nota: La letra de esta canción no está registrada en el código, pero puedes cantar siguiendo el video).";
        }
    }
</script>
</body>
</html>
