<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Karaoke Player</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        h1 { color: #1DB954; font-size: 32px; margin-bottom: 25px; }

        .search-box {
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        input[type="text"] {
            width: 65%;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 12px 25px;
            background-color: #1DB954;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1ed760;
        }

        /* Contenedor del reproductor corregido */
        .video-wrapper {
            width: 100%;
            max-width: 560px;
            margin: 0 auto 25px auto;
            aspect-ratio: 16/9;
            background: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Estilo para que el reproductor ocupe todo el espacio */
        #player {
            width: 100%;
            height: 100%;
            border: none;
        }

        .lyrics-box {
            background-color: #181818;
            padding: 30px;
            border-radius: 10px;
            height: 200px;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            scroll-behavior: smooth;
        }

        .lyric-line {
            font-size: 20px;
            margin: 15px 0;
            color: #666;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .lyric-line.active {
            color: #ffffff;
            font-size: 24px;
            text-shadow: 0 0 10px #1DB954;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>YouTube Karaoke Player</h1>
    
    <div class="search-box">
        <input type="text" id="youtubeUrl" placeholder="Pega el enlace de YouTube aquí...">
        <button onclick="procesarVideo()">Cargar Canción</button>
    </div>

    <!-- AQUÍ ESTÁ LA CORRECCIÓN: El contenedor con el ID correcto para la API -->
    <div class="video-wrapper">
        <div id="player"></div>
    </div>

    <div class="lyrics-box" id="lyricsContainer">
        <div id="lyricsContent">Pega un enlace válido para sincronizar la letra...</div>
    </div>
</div>

<!-- Cargamos la API de YouTube -->
<script src="https://youtube.com"></script>

<script>
    let player;
    let intervaloTiempo;

    // Base de datos de canciones sincronizadas
    const bibliotecaKaraoke = {
        "QycWbDcTK9w": [
            { time: 0, text: "🎵 (Introducción de la canción de Erika) 🎵" },
            { time: 5, text: "¡Feliz Cumpleaños Erika! 🎂" },
            { time: 10, text: "Que pases un excelente día..." },
            { time: 15, text: "🎵 ¡A cantar todos juntos! 🎵" }
        ],
        "w3JoAPJu7ho": [
            { time: 0, text: "🎵 (Introducción Musical) 🎵" },
            { time: 19, text: "Un canario que canta triste por su amor" },
            { time: 24, text: "Y una guitarra que llora en un rincón" },
            { time: 29, text: "No es la misma vida que yo planeé" },
            { time: 33, text: "para los dos..." }
        ]
    };

    // Extractor de ID limpio y mejorado de 11 caracteres
function extraerId(url) {
    // 1. Si el enlace es del formato corto (youtu.be/)
    if (url.includes("youtu.be/")) {
        let parteDespuesDeDiagonal = url.split("youtu.be/")[1];
        // Quitamos los parámetros extras que empiezan con el signo ?
        let idLimpio = parteDespuesDeDiagonal.split("?")[0];
        return idLimpio;
    }
    
    // 2. Si el enlace es del formato largo convencional (://youtube.com)
    if (url.includes("v=")) {
        let parteDespuesDeV = url.split("v=")[1];
        let idLimpio = parteDespuesDeV.split("&")[0];
        return idLimpio;
    }
    
    return null;
}

    function procesarVideo() {
        const url = document.getElementById('youtubeUrl').value;
        const id = extraerId(url);

        if (!id) {
            alert("Por favor, ingresa un enlace válido de YouTube.");
            return;
        }

        // Reiniciar reproductor si ya existía uno activo
        if (player && typeof player.destroy === 'function') {
            player.destroy();
            clearInterval(intervaloTiempo);
        }

        // Crear el reproductor oficial inyectando los datos en el div #player
        player = new YT.Player('player', {
            videoId: id,
            events: {
                'onStateChange': alCambiarEstado
            }
        });

        montarLetra(id);
    }

    function montarLetra(id) {
        const container = document.getElementById('lyricsContent');
        container.innerHTML = "";

        if (bibliotecaKaraoke[id]) {
            bibliotecaKaraoke[id].forEach((linea, index) => {
                const div = document.createElement('div');
                div.className = "lyric-line";
                div.id = `line-${index}`;
                div.textContent = linea.text;
                container.appendChild(div);
            });
        } else {
            container.innerHTML = "Video cargado con éxito.<br><br>Nota: La letra específica para este ID no está registrada en el código, pero el video comenzará a reproducirse.";
        }
    }

    function alCambiarEstado(event) {
        if (event.data === YT.PlayerState.PLAYING) {
            intervaloTiempo = setInterval(actualizarKaraoke, 200);
        } else {
            clearInterval(intervaloTiempo);
        }
    }

    function actualizarKaraoke() {
        const url = document.getElementById('youtubeUrl').value;
        const id = extraerId(url);
        
        if (!id || !bibliotecaKaraoke[id]) return;

        const tiempoActual = player.getCurrentTime();
        const lineas = bibliotecaKaraoke[id];
        let lineaActivaIndex = -1;

        for (let i = 0; i < lineas.length; i++) {
            if (tiempoActual >= lineas[i].time) {
                lineaActivaIndex = i;
            }
        }

        if (lineaActivaIndex !== -1) {
            document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
            const lineaActivaElemento = document.getElementById(`line-${lineaActivaIndex}`);
            if (lineaActivaElemento) {
                lineaActivaElemento.classList.add('active');
                lineaActivaElemento.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    }
</script>
</body>
</html>
