<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Karaoke Player</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        h1 { color: #1DB954; font-size: 32px; margin-bottom: 25px; }

        .search-box {
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        input[type="text"] {
            width: 65%;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            color: #000;
        }

        button {
            padding: 12px 25px;
            background-color: #1DB954;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1ed760;
        }

        .video-wrapper {
            width: 100%;
            max-width: 560px;
            margin: 0 auto 25px auto;
            aspect-ratio: 16/9;
            background: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .lyrics-box {
            background-color: #181818;
            padding: 30px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
        }

        .lyrics-text {
            font-size: 20px;
            line-height: 1.8;
            color: #ffffff;
            white-space: pre-line;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>YouTube Karaoke Player</h1>
    
    <div class="search-box">
        <input type="text" id="youtubeUrl" placeholder="Pega CUALQUIER enlace de YouTube aquí...">
        <button onclick="cargarCualquierVideo()">Cargar Canción</button>
    </div>

    <!-- Contenedor del reproductor clásico -->
    <div class="video-wrapper">
        <iframe id="reproductorClasico" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <!-- Caja de letras estática -->
    <div class="lyrics-box">
        <div class="lyrics-text" id="textoLetra">Pega el enlace de la canción para ver su letra aquí...</div>
    </div>
</div>

<script>
    // Base de datos de ejemplo para canciones conocidas
    const bibliotecaLetras = {
        "w3JoAPJu7ho": "Laura Pausini - Entre Tú y Mil Mares\n\nUn canario que canta triste por su amor\nY una guitarra que llora en un rincón\nNo es la misma vida que yo planeé para los dos...",
        "XXgmy443Udo": "¡Felicidades! Disfruta de este video musical en tu reproductor."
    };

    // NUEVO EXTRACTOR: Utiliza un objeto URL nativo del navegador. 
    // Es 100% infalible, no usa posiciones numéricas y funciona para cualquier video del mundo.
    function obtenerIdLimpio(url) {
        try {
            // Si es un enlace corto (youtu.be/ID)
            if (url.includes("youtu.be/")) {
                let ruta = new URL(url).pathname;
                return ruta.replace("/", ""); // Quita la barra y nos deja solo el ID
            }
            // Si es un enlace largo (://youtube.com)
            if (url.includes("v=")) {
                let parametros = new URL(url).searchParams;
                return parametros.get("v"); // Extrae directamente el valor después de v=
            }
            return null;
        } catch (e) {
            return null;
        }
    }

    function cargarCualquierVideo() {
        const enlaceInput = document.getElementById('youtubeUrl').value;
        const idVideo = obtenerIdLimpio(enlaceInput);

        if (!idVideo) {
            alert("Por favor, ingresa un enlace válido de YouTube.");
            return;
        }

        // Cargamos el video en el reproductor de forma limpia y exacta
        const iframe = document.getElementById('reproductorClasico');
        iframe.src = "https://youtube.com" + idVideo;

        // Mostramos la letra si existe en la base de datos, si no, dejamos un mensaje de éxito general
        const cajaTexto = document.getElementById('textoLetra');
        if (bibliotecaLetras[idVideo]) {
            cajaTexto.textContent = bibliotecaLetras[idVideo];
        } else {
            cajaTexto.innerHTML = "¡Cualquier video del mundo cargado con éxito! 🎉<br><br>(Nota: Puedes cantar siguiendo el video directamente).";
        }
    }
</script>
</body>
</html>
